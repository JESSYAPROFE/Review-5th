<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss LIMA English</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        :root {
            --duo-green: #58CC02;
            --duo-green-shadow: #46A302;
            --duo-blue: #1CB0F6;
            --duo-blue-shadow: #1899D6;
            --duo-red: #FF4B4B;
            --duo-red-shadow: #EA2B2B;
            --duo-gray: #E5E5E5;
            --duo-gray-shadow: #AFAFAF;
            --duo-text: #4B4B4B;
            --bg-color: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--duo-text);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Header / Progress */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--duo-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar-container {
            flex-grow: 1;
            margin: 0 20px;
            background-color: var(--duo-gray);
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--duo-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        .score {
            color: var(--duo-green);
            font-size: 20px;
            font-weight: 800;
            white-space: nowrap;
        }

        /* Main Content */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .question-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--duo-blue);
        }

        .reading-text {
            font-size: 18px;
            background-color: #F7F7F7;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid var(--duo-blue);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 700;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray-shadow);
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            color: var(--duo-text);
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
        }

        .option-btn:hover {
            background-color: #F7F7F7;
        }

        .option-btn.selected {
            border-color: var(--duo-blue);
            border-bottom-color: var(--duo-blue-shadow);
            background-color: #DDF4FF;
            color: var(--duo-blue);
        }

        .option-btn.correct {
            border-color: var(--duo-green);
            border-bottom-color: var(--duo-green-shadow);
            background-color: #D7FFB8;
            color: var(--duo-green);
        }

        .option-btn.wrong {
            border-color: var(--duo-red);
            border-bottom-color: var(--duo-red-shadow);
            background-color: #FFDFE0;
            color: var(--duo-red);
        }

        /* Footer / Feedback */
        footer {
            border-top: 2px solid var(--duo-gray);
            padding-top: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 90px;
        }

        .feedback {
            display: none;
            font-size: 20px;
            font-weight: 800;
            flex-grow: 1;
        }

        .feedback.correct { color: var(--duo-green); }
        .feedback.wrong { color: var(--duo-red); }

        .btn-main {
            background-color: var(--duo-green);
            border: none;
            border-bottom: 4px solid var(--duo-green-shadow);
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .btn-main:disabled {
            background-color: var(--duo-gray);
            border-bottom-color: var(--duo-gray-shadow);
            color: #AFAFAF;
            cursor: not-allowed;
        }

        .btn-main:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-secondary {
            background-color: white;
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray-shadow);
            color: var(--duo-text);
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .btn-secondary:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; flex-grow: 1; }

        #start-screen, #end-screen {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #start-screen h1, #end-screen h1 {
            font-size: 36px;
            color: var(--duo-green);
            margin-bottom: 20px;
        }

        #start-screen p, #end-screen p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .mascot {
            font-size: 80px;
            margin-bottom: 20px;
        }

        /* Sessions Screen */
        .screen-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--duo-green);
            margin-bottom: 6px;
        }

        .screen-subtitle {
            font-size: 16px;
            font-weight: 700;
            color: #9A9A9A;
            margin-bottom: 20px;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-bottom: 20px;
        }

        @media (max-width: 600px) {
            .sessions-grid {
                grid-template-columns: 1fr;
            }
        }

        .session-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background-color: white;
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray-shadow);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
        }

        .session-card:hover {
            background-color: #F7F7F7;
            border-color: var(--duo-blue);
            border-bottom-color: var(--duo-blue-shadow);
        }

        .session-card:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .session-card.done {
            background-color: #F2FFE8;
            border-color: var(--duo-green);
            border-bottom-color: var(--duo-green-shadow);
        }

        .session-emoji {
            font-size: 32px;
            line-height: 1;
        }

        .session-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .session-name {
            font-size: 17px;
            font-weight: 800;
            color: var(--duo-text);
        }

        .session-meta {
            font-size: 13px;
            font-weight: 700;
            color: #9A9A9A;
        }

        .session-card.done .session-meta {
            color: var(--duo-green);
        }

        .end-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- HEADER -->
    <header id="app-header" style="display: none;">
        <div class="logo">🦉 Miss LIMA English</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="score" id="score">0/0</div>
    </header>

    <!-- MAIN -->
    <main>
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <div class="mascot">👩‍🏫</div>
            <h1>Miss LIMA English</h1>
            <p>Pronto para revisar para a prova do 5º ano?</p>
            <button class="btn-main" onclick="showSessions()">Começar Lição</button>
        </div>

        <!-- SESSIONS SCREEN -->
        <div id="sessions-screen" class="screen">
            <h2 class="screen-title">Escolha uma sessão</h2>
            <p class="screen-subtitle">Cada sessão tem um tema com várias perguntas.</p>
            <div class="sessions-grid" id="sessions-grid"></div>
        </div>

        <!-- QUESTION SCREEN -->
        <div id="question-screen" class="screen">
            <h2 class="question-title" id="q-title">Complete a frase:</h2>
            <div id="reading-box" class="reading-text" style="display: none;"></div>
            <p class="question-text" id="q-text"></p>
            <div class="options-grid" id="options-container">
                <!-- Botões gerados via JS -->
            </div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen" class="screen">
            <div class="mascot" id="end-mascot">🏆</div>
            <h1 id="end-title">Sessão Concluída!</h1>
            <p id="end-score"></p>
            <div class="end-actions">
                <button class="btn-main" id="next-session-btn" onclick="nextSession()">Próxima Sessão</button>
                <button class="btn-secondary" onclick="showSessions()">Escolher Sessão</button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="app-footer" style="display: none;">
        <div class="feedback" id="feedback"></div>
        <button class="btn-main" id="action-btn" disabled onclick="handleAction()">Verificar</button>
    </footer>
</div>

<script>
    const SEA_TURTLES_TEXT = "Sea turtles are amazing marine animals. They live in the ocean but they are reptiles, not fish! They have hard shells to protect their bodies. Mother turtles lay their eggs on the beach. When the baby turtles are born, they run to the water. Sea turtles love to eat jellyfish. However, they sometimes mistake plastic bags for food, which is very dangerous for them.";

    // SESSÕES: cada tema tem seu próprio conjunto de perguntas
    const sessions = [
        {
            id: 'environment',
            emoji: '🍃',
            title: 'Vocabulary - Environment',
            subtitle: 'Meio Ambiente',
            questions: [
                {
                    text: 'Complete: We must save water and other natural _____.',
                    options: ['🌱 resources', '🗑️ garbage', '🏭 pollution', '♻️ biodegradable'],
                    answer: '🌱 resources'
                },
                {
                    text: 'Complete: A plastic bottle is not _____. It stays in nature for many years.',
                    options: ['♻️ biodegradable', '🎣 overfishing', '🛢️ oil spill', '🌱 resources'],
                    answer: '♻️ biodegradable'
                },
                {
                    text: 'Complete: When factories put dirty smoke in the air, it causes _____.',
                    options: ['🏭 pollution', '🛢️ oil spill', '🌱 resources', '🗑️ garbage'],
                    answer: '🏭 pollution'
                },
                {
                    text: 'Complete: Catching too many fish from the ocean is called _____.',
                    options: ['🎣 overfishing', '🏭 pollution', '♻️ biodegradable', '🗑️ garbage'],
                    answer: '🎣 overfishing'
                },
                {
                    text: 'Complete: When a ship spills oil into the sea, we call it an _____.',
                    options: ['🛢️ oil spill', '🎣 overfishing', '🌱 resources', '🌬️ oxygen'],
                    answer: '🛢️ oil spill'
                },
                {
                    text: 'Complete: Trees and plants give us _____ to breathe.',
                    options: ['🌬️ oxygen', '🗑️ garbage', '🏭 pollution', '🎣 overfishing'],
                    answer: '🌬️ oxygen'
                },
                {
                    text: 'Complete: The 3 Rs are Reduce, Reuse and _____.',
                    options: ['♻️ recycle', '🌱 resources', '🗑️ garbage', '🏭 pollution'],
                    answer: '♻️ recycle'
                },
                {
                    text: 'Complete: Old paper, glass and plastic go in the _____ bin.',
                    options: ['♻️ recycling', '🌬️ oxygen', '🎣 overfishing', '🛢️ oil spill'],
                    answer: '♻️ recycling'
                }
            ]
        },
        {
            id: 'past-habits',
            emoji: '⏳',
            title: 'Grammar - Past Habits',
            subtitle: 'used to',
            questions: [
                {
                    text: 'Complete: Before there were cars, people _____ (travel) by horse.',
                    options: ['used to travel', 'use to travel', "didn't use to travel", 'used travel'],
                    answer: 'used to travel'
                },
                {
                    text: 'Complete: I _____ (not / have) a cell phone when I was a child.',
                    options: ["didn't use to have", "don't use to have", 'not used to have', "didn't used to have"],
                    answer: "didn't use to have"
                },
                {
                    text: 'Complete the question: Why _____ people _____ (write) letters in the past?',
                    options: ['did / use to write', 'do / used to write', 'did / used to write', 'were / use to write'],
                    answer: 'did / use to write'
                },
                {
                    text: 'Complete: My grandmother _____ (listen) to the radio every night.',
                    options: ['used to listen', 'use to listen', 'used listening', "didn't use to listen"],
                    answer: 'used to listen'
                },
                {
                    text: 'Complete: _____ you _____ (play) with dolls when you were little?',
                    options: ['Did / use to play', 'Did / used to play', 'Do / use to play', 'Were / use to play'],
                    answer: 'Did / use to play'
                },
                {
                    text: 'Complete: People _____ (not / watch) videos on the internet in 1990.',
                    options: ["didn't use to watch", "don't use to watch", 'not used to watch', "didn't used to watch"],
                    answer: "didn't use to watch"
                },
                {
                    text: 'Choose the CORRECT sentence:',
                    options: [
                        'She used to ride a bike to school.',
                        'She use to rode a bike to school.',
                        'She used to rode a bike to school.',
                        'She use to ride a bike to school.'
                    ],
                    answer: 'She used to ride a bike to school.'
                }
            ]
        },
        {
            id: 'tools',
            emoji: '🛠️',
            title: 'Grammar - Tools and Purposes',
            subtitle: 'use it to',
            questions: [
                {
                    text: 'What do you do with a toothbrush? 🪥',
                    options: [
                        'You use it to clean your teeth.',
                        'You use it to cover your cut.',
                        'You use it to call friends.',
                        'You use it to watch shows.'
                    ],
                    answer: 'You use it to clean your teeth.'
                },
                {
                    text: 'What do you do with an umbrella? ☂️',
                    options: [
                        'You use it to put over your head in the rain.',
                        'You use it to drive to places.',
                        'You use it to play video games.',
                        'You use it to take photos.'
                    ],
                    answer: 'You use it to put over your head in the rain.'
                },
                {
                    text: 'What do you do with a bandage? 🩹',
                    options: [
                        'You use it to cover your cut.',
                        'You use it to clean your teeth.',
                        'You use it to read comics.',
                        'You use it to call your family.'
                    ],
                    answer: 'You use it to cover your cut.'
                },
                {
                    text: 'What do you do with a pair of scissors? ✂️',
                    options: [
                        'You use it to cut paper.',
                        'You use it to keep warm at night.',
                        'You use it to eat soup.',
                        'You use it to listen to music.'
                    ],
                    answer: 'You use it to cut paper.'
                },
                {
                    text: 'What do you do with a pillow? 🛏️',
                    options: [
                        'You use it to sleep comfortably.',
                        'You use it to cut paper.',
                        'You use it to clean the floor.',
                        'You use it to brush your hair.'
                    ],
                    answer: 'You use it to sleep comfortably.'
                },
                {
                    text: 'What do you do with a pencil? ✏️',
                    options: [
                        'You use it to write in your notebook.',
                        'You use it to cook dinner.',
                        'You use it to open a bottle.',
                        'You use it to wash the dishes.'
                    ],
                    answer: 'You use it to write in your notebook.'
                },
                {
                    text: 'What do you do with a phone? 📱',
                    options: [
                        'You use it to call your family.',
                        'You use it to sweep the floor.',
                        'You use it to cut your food.',
                        'You use it to dry your clothes.'
                    ],
                    answer: 'You use it to call your family.'
                }
            ]
        },
        {
            id: 'hobbies',
            emoji: '🧩',
            title: 'Vocabulary - Hobbies and Objects',
            subtitle: 'Hobbies e Objetos',
            questions: [
                {
                    text: 'What is an ancient plant or animal preserved in rock? 🦴',
                    options: ['a fossil', 'an insect', 'a plush toy', 'a comic book'],
                    answer: 'a fossil'
                },
                {
                    text: 'What do you call small creatures like ants and butterflies? 🐜',
                    options: ['insects', 'fossils', 'video games', 'photos'],
                    answer: 'insects'
                },
                {
                    text: 'Which object has stories told with pictures? 📚',
                    options: ['a comic book', 'a fossil', 'an insect', 'a video game'],
                    answer: 'a comic book'
                },
                {
                    text: 'Which object is soft and you can hug? 🧸',
                    options: ['a plush toy', 'a fossil', 'a comic book', 'an insect'],
                    answer: 'a plush toy'
                },
                {
                    text: 'What do you play on a screen with your friends? 🎮',
                    options: ['a video game', 'a plush toy', 'a fossil', 'a comic book'],
                    answer: 'a video game'
                },
                {
                    text: 'What do you use to take pictures? 📷',
                    options: ['a camera', 'a fossil', 'a plush toy', 'a video game'],
                    answer: 'a camera'
                },
                {
                    text: 'Which hobby uses a bicycle? 🚲',
                    options: ['cycling', 'reading', 'collecting fossils', 'playing video games'],
                    answer: 'cycling'
                }
            ]
        },
        {
            id: 'reading',
            emoji: '🐢',
            title: 'Reading - Amazing Sea Turtles',
            subtitle: 'Leitura e Interpretação',
            questions: [
                {
                    readingText: SEA_TURTLES_TEXT,
                    text: 'According to the text, are sea turtles fish?',
                    options: ['No, they are reptiles.', 'Yes, they are fish.', 'No, they are plants.', 'Yes, they are marine mammals.'],
                    answer: 'No, they are reptiles.'
                },
                {
                    readingText: SEA_TURTLES_TEXT,
                    text: 'Why is plastic dangerous for sea turtles?',
                    options: ['Because they mistake it for food.', 'Because it is too hard.', 'Because it is colorful.', 'Because it covers their shells.'],
                    answer: 'Because they mistake it for food.'
                },
                {
                    readingText: SEA_TURTLES_TEXT,
                    text: 'Where do mother turtles lay their eggs?',
                    options: ['On the beach.', 'In the deep ocean.', 'Under the rocks.', 'In the forest.'],
                    answer: 'On the beach.'
                },
                {
                    readingText: SEA_TURTLES_TEXT,
                    text: 'What do sea turtles love to eat?',
                    options: ['Jellyfish.', 'Plastic bags.', 'Sea plants.', 'Small fish.'],
                    answer: 'Jellyfish.'
                },
                {
                    readingText: SEA_TURTLES_TEXT,
                    text: 'What protects the body of a sea turtle?',
                    options: ['A hard shell.', 'A big fin.', 'Soft fur.', 'Long legs.'],
                    answer: 'A hard shell.'
                },
                {
                    readingText: SEA_TURTLES_TEXT,
                    text: 'When the baby turtles are born, where do they run?',
                    options: ['To the water.', 'To the rocks.', 'To the trees.', 'To the sand hills.'],
                    answer: 'To the water.'
                }
            ]
        }
    ];

    // ESTADO DO APP
    let currentSessionIndex = -1;
    let currentQuestionIndex = 0;
    let selectedOption = null;
    let isAnswered = false;
    let correctCount = 0;
    const results = {};

    // ELEMENTOS DO DOM
    const startScreen = document.getElementById('start-screen');
    const sessionsScreen = document.getElementById('sessions-screen');
    const sessionsGrid = document.getElementById('sessions-grid');
    const questionScreen = document.getElementById('question-screen');
    const endScreen = document.getElementById('end-screen');
    const appHeader = document.getElementById('app-header');
    const appFooter = document.getElementById('app-footer');
    const qTitle = document.getElementById('q-title');
    const qText = document.getElementById('q-text');
    const readingBox = document.getElementById('reading-box');
    const optionsContainer = document.getElementById('options-container');
    const progressBar = document.getElementById('progress-bar');
    const feedback = document.getElementById('feedback');
    const actionBtn = document.getElementById('action-btn');
    const scoreLabel = document.getElementById('score');
    const endMascot = document.getElementById('end-mascot');
    const endTitle = document.getElementById('end-title');
    const endScore = document.getElementById('end-score');
    const nextSessionBtn = document.getElementById('next-session-btn');

    function hideAllScreens() {
        [startScreen, sessionsScreen, questionScreen, endScreen].forEach(screen => screen.classList.remove('active'));
    }

    function currentSession() {
        return sessions[currentSessionIndex];
    }

    function showSessions() {
        hideAllScreens();
        appHeader.style.display = 'none';
        appFooter.style.display = 'none';
        sessionsScreen.classList.add('active');
        renderSessions();
    }

    function renderSessions() {
        sessionsGrid.innerHTML = '';
        sessions.forEach((session, index) => {
            const result = results[session.id];
            const card = document.createElement('button');
            card.className = 'session-card' + (result ? ' done' : '');
            const meta = result
                ? `✅ ${result.correct}/${result.total} acertos`
                : `${session.questions.length} perguntas`;
            card.innerHTML =
                `<span class="session-emoji">${session.emoji}</span>` +
                `<span class="session-info">` +
                    `<span class="session-name">${session.title}</span>` +
                    `<span class="session-meta">${session.subtitle} · ${meta}</span>` +
                `</span>`;
            card.onclick = () => startSession(index);
            sessionsGrid.appendChild(card);
        });
    }

    function startSession(index) {
        currentSessionIndex = index;
        currentQuestionIndex = 0;
        correctCount = 0;
        hideAllScreens();
        questionScreen.classList.add('active');
        appHeader.style.display = 'flex';
        appFooter.style.display = 'flex';
        updateScore();
        loadQuestion();
    }

    function updateScore() {
        scoreLabel.textContent = `${correctCount}/${currentSession().questions.length}`;
    }

    function loadQuestion() {
        const session = currentSession();
        const currentQ = session.questions[currentQuestionIndex];

        selectedOption = null;
        isAnswered = false;
        feedback.style.display = 'none';
        feedback.className = 'feedback';
        actionBtn.disabled = true;
        actionBtn.textContent = 'Verificar';
        actionBtn.style.backgroundColor = 'var(--duo-gray)';
        actionBtn.style.borderBottomColor = 'var(--duo-gray-shadow)';

        const progressPercent = (currentQuestionIndex / session.questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        qTitle.textContent = `${session.emoji} ${session.title}`;
        qText.textContent = currentQ.text;

        if (currentQ.readingText) {
            readingBox.style.display = 'block';
            readingBox.textContent = currentQ.readingText;
        } else {
            readingBox.style.display = 'none';
        }

        optionsContainer.innerHTML = '';
        const shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);

        shuffledOptions.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = option;
            btn.onclick = () => selectOption(btn, option);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(btn, option) {
        if (isAnswered) return;

        optionsContainer.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));

        btn.classList.add('selected');
        selectedOption = option;

        actionBtn.disabled = false;
        actionBtn.style.backgroundColor = 'var(--duo-green)';
        actionBtn.style.borderBottomColor = 'var(--duo-green-shadow)';
    }

    function handleAction() {
        if (!isAnswered) {
            checkAnswer();
        } else {
            nextQuestion();
        }
    }

    function checkAnswer() {
        isAnswered = true;
        actionBtn.disabled = false;
        actionBtn.textContent = 'Continuar';

        const currentQ = currentSession().questions[currentQuestionIndex];
        const allBtns = optionsContainer.querySelectorAll('.option-btn');

        feedback.style.display = 'block';

        if (selectedOption === currentQ.answer) {
            correctCount++;
            updateScore();
            feedback.textContent = '🎉 Muito bem! Você acertou!';
            feedback.classList.add('correct');
            allBtns.forEach(btn => {
                if (btn.textContent === selectedOption) {
                    btn.classList.remove('selected');
                    btn.classList.add('correct');
                }
            });
        } else {
            feedback.textContent = `❌ Quase! A resposta certa é: ${currentQ.answer}`;
            feedback.classList.add('wrong');
            allBtns.forEach(btn => {
                if (btn.textContent === selectedOption) {
                    btn.classList.remove('selected');
                    btn.classList.add('wrong');
                }
                if (btn.textContent === currentQ.answer) {
                    btn.classList.add('correct');
                }
            });
            actionBtn.style.backgroundColor = 'var(--duo-red)';
            actionBtn.style.borderBottomColor = 'var(--duo-red-shadow)';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentSession().questions.length) {
            loadQuestion();
        } else {
            finishSession();
        }
    }

    function finishSession() {
        const session = currentSession();
        const total = session.questions.length;
        const allRight = correctCount === total;

        results[session.id] = { correct: correctCount, total: total };

        progressBar.style.width = '100%';
        appFooter.style.display = 'none';
        hideAllScreens();
        endScreen.classList.add('active');

        endMascot.textContent = allRight ? '🏆' : '💪';
        endTitle.textContent = allRight ? 'Perfeito!' : 'Sessão Concluída!';
        endScore.textContent = `Você acertou ${correctCount} de ${total} em "${session.title}".`;

        const hasNext = currentSessionIndex + 1 < sessions.length;
        nextSessionBtn.style.display = hasNext ? 'block' : 'none';
    }

    function nextSession() {
        if (currentSessionIndex + 1 < sessions.length) {
            startSession(currentSessionIndex + 1);
        }
    }
</script>

</body>
</html>
